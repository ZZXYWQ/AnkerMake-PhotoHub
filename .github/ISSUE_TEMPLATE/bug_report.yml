name: 问题报告
description: 报告 PhotoHub 公开测试版的问题（不要上传账号或私有设计）
body:
  - type: markdown
    attributes:
      value: 当前推荐 PhotoHub 0.7.0 StartupFix2（安装器文件版本 0.7.0.2），适配 AnkerMake Studio 5.1.3、编辑器 1.23.02 和 Windows 10/11 x64。其他宿主/编辑器版本不在本次测试范围；旧版本问题请注明实际版本。所有公开版本均为测试版，不保证及时更新或修复。不要上传令牌、账号资料、私有 PSD 或抓包。
  - type: input
    id: versions
    attributes:
      label: 插件、宿主、编辑器与 Windows 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤、预期行为和实际行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 已脱敏的错误信息或截图（可选）
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交检查
      options:
        - label: 没有包含凭据、私有设计或未经许可的素材
          required: true
