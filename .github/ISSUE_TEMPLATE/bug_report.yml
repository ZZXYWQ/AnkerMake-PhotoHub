name: 问题报告
description: 报告 0.6.1 公开测试版的问题（不要上传账号或私有设计）
body:
  - type: markdown
    attributes:
      value: 请先确认使用 PhotoHub 0.6.1、AnkerMake Studio 5.0.4、编辑器 1.22.03 和 Windows 10/11 x64。其他版本不在本次测试范围。不要上传令牌、账号资料、私有 PSD 或抓包。
  - type: input
    id: versions
    attributes:
      label: 插件、宿主、编辑器与 Windows 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤、预期行为和实际行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 已脱敏的错误信息或截图（可选）
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交检查
      options:
        - label: 没有包含凭据、私有设计或未经许可的素材
          required: true
